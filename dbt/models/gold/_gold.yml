version: 2

models:
  - name: gold_inpatient_stays
    description: >
      One row per inpatient stay (silver claim), counted in its admission month and matched to the rate
      denominator (in_claims_window, in_ffs_denominator). The common stay source for every gold mart.
    columns:
      - name: clm_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('silver_inpatient_claims')
                field: clm_id
      - name: bene_id
        data_tests: [not_null]
      - name: admission_date
        data_tests: [not_null]
      - name: discharge_date
        data_tests: [not_null]
      - name: incurred_month
        data_tests: [not_null]
      - name: inpatient_days
        data_tests:
          - value_between:
              arguments:
                min_value: 1

  - name: gold_inpatient_member_months
    description: >
      Member-month fact: one row per member-month that is in the claims window and FFS-eligible (the rate
      denominator), with the inpatient admits, days, and paid amount of the stays admitted in that month.
    data_tests:
      - unique_combination:
          arguments:
            columns: [bene_id, month_start]
    columns:
      - name: bene_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_members')
                field: bene_id
      - name: month_start
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: "date '{{ var(\"claims_window_start\") }}'"
                max_value: "date '{{ var(\"claims_window_end\") }}'"
      - name: inpatient_admits
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
      - name: inpatient_days
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
      - name: inpatient_paid_amount
        description: Medicare paid amount (CLM_PMT_AMT). No lower bound, because real adjustments can be negative.
        data_tests: [not_null]

  - name: gold_inpatient_pmpm_by_year
    description: >
      Inpatient paid amount per member per month by calendar year of admission, with the in-window stays
      outside the denominator reported beside it.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: member_months
        data_tests:
          - value_between:
              arguments:
                min_value: 0
      - name: inpatient_pmpm
        data_tests:
          - value_between:
              arguments:
                min_value: 0
              config:
                severity: warn

  - name: gold_inpatient_utilization_by_year
    description: Inpatient admits and days per 1,000 member-years by calendar year of admission.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: member_months
        data_tests:
          - value_between:
              arguments:
                min_value: 1
      - name: admits_per_1000
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0
      - name: days_per_1000
        data_tests:
          - not_null
          - value_between:
              arguments:
                min_value: 0

  - name: gold_readmission_30d_stays
    description: >
      30-day all-cause readmissions, one row per inpatient stay: whether it is an index stay, the one
      exclusion that applies if not, and its first readmission 1 to 30 days after discharge.
    columns:
      - name: clm_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('gold_inpatient_stays')
                field: clm_id
      - name: index_exclusion_reason
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - discharged_before_claims_window
                  - less_than_30_days_follow_up
                  - died_in_hospital
                  - left_against_medical_advice
                  - transferred_to_acute_care
                  - continued_same_day
                  - not_ffs_enrolled_through_follow_up
      - name: readmission_clm_id
        data_tests:
          - relationships:
              arguments:
                to: ref('gold_inpatient_stays')
                field: clm_id
      - name: days_to_readmission
        data_tests:
          - value_between:
              arguments:
                min_value: 1
                max_value: 30

  - name: gold_readmission_30d_by_year
    description: 30-day all-cause readmission rate by calendar year of the index discharge, with exclusion counts.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: readmission_rate
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 1
