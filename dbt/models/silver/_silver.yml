version: 2

models:
  - name: silver_inpatient_claim_lines
    description: >
      Inpatient claim lines (revenue center lines) that survived deduplication and structural checks.
      HCPCS codes are classified by format only; no CPT descriptions are stored (AMA copyright).
    data_tests:
      - unique_combination:
          arguments:
            columns: [clm_id, clm_line_num]
    columns:
      - name: clm_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_inpatient_claims')
                field: clm_id
      - name: revenue_center_code
        data_tests: [not_null]
      - name: hcpcs_format
        data_tests:
          - accepted_values:
              arguments:
                values: [missing, cpt_category_i, cpt_category_ii, cpt_category_iii, cpt_pla, hcpcs_level_ii, modifier_in_code_field, invalid_format]

  - name: silver_inpatient_claims
    description: One row per inpatient claim (stay), typed, deduplicated, and structurally valid.
    columns:
      - name: clm_id
        data_tests: [unique, not_null]
      - name: bene_id
        data_tests: [not_null]
      - name: thru_date
        data_tests: [not_null]
      - name: discharge_fiscal_year
        data_tests:
          - value_between:
              arguments:
                min_value: 2015
                max_value: 2030
      - name: length_of_stay_days
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 3650
      - name: inpatient_days
        data_tests:
          - value_between:
              arguments:
                min_value: 1
      - name: total_charge_amount
        data_tests:
          - value_between:
              arguments:
                min_value: 0
      - name: line_count
        data_tests:
          - value_between:
              arguments:
                min_value: 1

  - name: silver_quarantine
    description: >
      Rows that failed a structural rule, with the reasons and a pointer back to the landed file and line.
      Code-set problems are not quarantined; they are measured in silver_dq_code_conformance.
    columns:
      - name: dq_errors
        data_tests: [not_null]

  - name: silver_inpatient_diagnoses
    description: >
      Every diagnosis position on every silver claim, with its ICD-10-CM status for the claim's discharge
      fiscal year (macros/icd10.sql). Code problems are measured here, not quarantined.
    data_tests:
      - unique_combination:
          arguments:
            columns: [clm_id, dx_role, dx_sequence]
    columns:
      - name: clm_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_inpatient_claims')
                field: clm_id
      - name: dx_role
        data_tests:
          - accepted_values:
              arguments:
                values: [admitting, principal, other, external_cause]
      - name: code_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [valid, header_not_billable, truncated, not_valid_in_fiscal_year, invalid_format, not_in_code_set, code_set_not_loaded]

  - name: silver_inpatient_procedures
    description: >
      Every ICD procedure on every silver claim, with its ICD-10-PCS status for the claim's discharge
      fiscal year, including ICD-10-CM codes found in procedure fields.
    data_tests:
      - unique_combination:
          arguments:
            columns: [clm_id, px_sequence]
    columns:
      - name: clm_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_inpatient_claims')
                field: clm_id
      - name: code_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [valid, header_not_billable, truncated, not_valid_in_fiscal_year, diagnosis_code_in_procedure_field, invalid_format, not_in_code_set, code_set_not_loaded]

  - name: silver_dq_code_conformance
    description: Code-set conformance by field, role, status, and fiscal year.
    data_tests:
      - unique_combination:
          arguments:
            columns: [code_field, role, status, fiscal_year]

  - name: ref_icd10_codes
    description: ICD-10-CM and ICD-10-PCS codes by fiscal year from the CMS order files (code and flag only).
    data_tests:
      - unique_combination:
          arguments:
            columns: [code_system, fiscal_year, code]

  - name: silver_member_months
    description: >
      One row per member per month with Medicare entitlement, built from the monthly indicators (exact,
      not approximated). Denominator flags: is_ffs_eligible, in_claims_window.
    data_tests:
      - unique_combination:
          arguments:
            columns: [bene_id, month_start]
    columns:
      - name: bene_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('silver_members')
                field: bene_id
      - name: month_start
        data_tests: [not_null]
      - name: entitlement_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["1", "2", "3", "A", "B", "C"]
      - name: age_at_month_start
        data_tests:
          - value_between:
              arguments:
                min_value: 0
                max_value: 120

  - name: silver_members
    description: One row per member with attributes from the most recent valid reference year.
    columns:
      - name: bene_id
        data_tests: [unique, not_null]
      - name: birth_date
        data_tests: [not_null]
      - name: distinct_birth_dates
        description: Should be 1; more means the member's birth date changed between yearly files.
        data_tests:
          - value_between:
              arguments:
                min_value: 1
                max_value: 1
              config:
                severity: warn
